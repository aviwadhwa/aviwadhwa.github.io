<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" fill="none" role="img" aria-labelledby="title desc">
<title id="title">An AdS binary and its nonrelativistic harmonic well</title>
<desc id="desc">Two particle worldlines wind inside an AdS cylinder. CFT marks the cylindrical boundary. An arrow labelled NR limit leads to a harmonic bowl with two orbiting bodies.</desc>
